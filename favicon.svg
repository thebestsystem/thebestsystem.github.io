<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="qatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A1538" />
      <stop offset="100%" stop-color="#5B0E25" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9DF7B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield with Qatar Maroon & Gold -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#qatarGradient)" stroke="url(#goldGradient)" stroke-width="2.5" />
  <!-- Qatar National Crest Motif (Dhow & Waves & Falcon Wings) -->
  <g filter="url(#glow)">
    <!-- Dhow Sail -->
    <path d="M32 12 Q38 22 46 32 L32 32 Z" fill="url(#goldGradient)" opacity="0.95" />
    <path d="M30 16 Q24 24 18 32 L30 32 Z" fill="url(#goldGradient)" opacity="0.8" />
    <!-- Mast -->
    <path d="M31 10 L31 34" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Dhow Hull -->
    <path d="M14 36 Q32 44 50 36 Q42 46 22 46 Q14 44 14 36 Z" fill="url(#goldGradient)" />
    <!-- Waves -->
    <path d="M16 50 Q24 47 32 50 Q40 53 48 50" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>
